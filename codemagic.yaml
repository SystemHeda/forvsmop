workflows:
  alamootplus_debug:
    name: AlamootPlus Debug APK
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      vars:
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m"

    scripts:
      - name: Verify files
        script: |
          set -e
          pwd
          ls -la
          test -f settings.gradle
          test -f app/build.gradle

      - name: Build with system Gradle (no wrapper)
        script: |
          set -e
          gradle -v
          gradle clean :app:assembleDebug --no-daemon --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    cache:
      cache_paths:
        - ~/.gradle/caches
